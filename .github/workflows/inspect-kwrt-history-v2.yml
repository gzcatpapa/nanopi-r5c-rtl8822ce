name: Inspect Kwrt historical build (v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect Kwrt history around the installed firmware date
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/kiddin9/Kwrt.git kwrt
          cd kwrt
          echo "=== Remote branches ==="
          git branch -a
          echo "=== Recent commits touching Rockchip paths before 2025-05-16 ==="
          git log --all --format='%H %cI %s' --until='2025-05-16 23:59:59 +0000' -n 20 -- '*rockchip*' '.github/workflows/*' || true
          echo "=== Latest reachable commit at or before 2025-05-16 ==="
          REV="$(git rev-list --all --before='2025-05-16 23:59:59 +0000' -n 1)"
          test -n "$REV"
          echo "REV=$REV"
          git show -s --format=fuller "$REV"
          echo "=== Historical tree paths related to Rockchip ==="
          git ls-tree -r --name-only "$REV" | grep -Ei 'rockchip|r5c|\.config$|build.*yml' | head -200 || true
          echo "=== Historical workflow files ==="
          for f in $(git ls-tree -r --name-only "$REV" | grep '^\.github/workflows/.*\.yml$' | head -10); do
            echo "--- $f"
            git show "$REV:$f" | grep -n -Ei 'kernel|rockchip|coolsnowwolf|branch|checkout|target' | head -80 || true
          done
          echo "=== Historical Rockchip configs and scripts ==="
          for f in $(git ls-tree -r --name-only "$REV" | grep -Ei 'rockchip.*(config|\.sh)$|rockchip.*/\.config$' | head -20); do
            echo "--- $f"
            git show "$REV:$f" | grep -n -Ei 'kernel|rtw|8822|mac80211|cfg80211|firmware|CONFIG_TARGET|CONFIG_PACKAGE' | head -160 || true
          done
